name: check
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml openpyxl
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t .
      - name: Manifests and skill names
        run: python3 scripts/check_plugin.py
