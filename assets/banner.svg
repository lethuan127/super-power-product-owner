<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">super-power-product-owner</title>
  <desc id="d">Claude skills that take the repeat work off a Product Owner's week: a project wiki, user guides and list reconciliation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14123a"/>
      <stop offset="1" stop-color="#2d1f63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <circle cx="1130" cy="-40" r="260" fill="#6b4dff" opacity="0.18"/>
  <circle cx="900" cy="440" r="200" fill="#ff7a59" opacity="0.10"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- left: name and tagline -->
    <rect x="72" y="92" width="64" height="8" rx="4" fill="url(#accent)"/>
    <text x="72" y="160" font-size="50" font-weight="800" fill="#ffffff" letter-spacing="-1">super-power</text>
    <text x="72" y="218" font-size="50" font-weight="800" fill="url(#accent)" letter-spacing="-1">product-owner</text>
    <text x="72" y="268" font-size="21" fill="#d9d4ff">Claude skills that take the repeat work</text>
    <text x="72" y="296" font-size="21" fill="#d9d4ff">off a Product Owner's week.</text>
    <text x="72" y="336" font-size="16" fill="#a99fe6">Kỹ năng Claude giúp PO bớt việc lặp lại mỗi tuần</text>

    <!-- right: three cards -->
    <!-- card 1: project wiki -->
    <g transform="translate(640 70) rotate(-4)" filter="url(#shadow)">
      <rect width="190" height="240" rx="16" fill="#ffffff"/>
      <rect x="18" y="18" width="34" height="34" rx="8" fill="#ece8ff"/>
      <path d="M27 28h16M27 35h16M27 42h10" stroke="#6b4dff" stroke-width="3" stroke-linecap="round"/>
      <text x="62" y="41" font-size="16" font-weight="700" fill="#1d1846">Project wiki</text>
      <rect x="18" y="72" width="154" height="8" rx="4" fill="#e7e4f5"/>
      <rect x="18" y="90" width="120" height="8" rx="4" fill="#e7e4f5"/>
      <rect x="18" y="118" width="70" height="22" rx="11" fill="#ece8ff"/>
      <text x="30" y="134" font-size="12" fill="#6b4dff">users.md</text>
      <rect x="94" y="118" width="70" height="22" rx="11" fill="#ece8ff"/>
      <text x="106" y="134" font-size="12" fill="#6b4dff">terms.md</text>
      <rect x="18" y="148" width="92" height="22" rx="11" fill="#ece8ff"/>
      <text x="30" y="164" font-size="12" fill="#6b4dff">decisions.md</text>
      <rect x="18" y="190" width="154" height="8" rx="4" fill="#e7e4f5"/>
      <rect x="18" y="208" width="96" height="8" rx="4" fill="#e7e4f5"/>
    </g>

    <!-- card 2: user guide -->
    <g transform="translate(850 54)" filter="url(#shadow)">
      <rect width="190" height="240" rx="16" fill="#ffffff"/>
      <rect x="18" y="18" width="34" height="34" rx="8" fill="#fff1dc"/>
      <path d="M27 35l5 5 10-11" stroke="#f08a00" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="41" font-size="16" font-weight="700" fill="#1d1846">User guide</text>
      <g font-size="13" fill="#1d1846">
        <circle cx="30" cy="84" r="11" fill="#ffb547"/><text x="26" y="89" font-weight="700" fill="#ffffff">1</text>
        <rect x="50" y="80" width="118" height="8" rx="4" fill="#e7e4f5"/>
        <circle cx="30" cy="120" r="11" fill="#ffb547"/><text x="26" y="125" font-weight="700" fill="#ffffff">2</text>
        <rect x="50" y="110" width="96" height="22" rx="6" fill="#1d1846"/>
        <text x="60" y="126" font-size="12" font-weight="700" fill="#ffffff">Cancel order</text>
        <circle cx="30" cy="156" r="11" fill="#ffb547"/><text x="26" y="161" font-weight="700" fill="#ffffff">3</text>
        <rect x="50" y="152" width="104" height="8" rx="4" fill="#e7e4f5"/>
      </g>
      <rect x="18" y="186" width="154" height="36" rx="8" fill="#f5f3fc" stroke="#e1dcf5"/>
      <text x="30" y="209" font-size="12" fill="#8a82b8">[screenshot: Orders]</text>
    </g>

    <!-- card 3: compare lists -->
    <g transform="translate(1060 78) rotate(4)" filter="url(#shadow)">
      <rect width="170" height="240" rx="16" fill="#ffffff"/>
      <rect x="18" y="18" width="34" height="34" rx="8" fill="#ffe6df"/>
      <path d="M27 30h14l-4-4M43 42H29l4 4" stroke="#ff5a36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="41" font-size="16" font-weight="700" fill="#1d1846">Compare</text>
      <g font-size="12">
        <text x="18" y="84" fill="#8a82b8">A</text><text x="96" y="84" fill="#8a82b8">B</text>
        <rect x="18" y="94" width="60" height="18" rx="5" fill="#dff5e8"/><rect x="92" y="94" width="60" height="18" rx="5" fill="#dff5e8"/>
        <rect x="18" y="120" width="60" height="18" rx="5" fill="#dff5e8"/><rect x="92" y="120" width="60" height="18" rx="5" fill="#dff5e8"/>
        <rect x="18" y="146" width="60" height="18" rx="5" fill="#ffe6df"/><rect x="92" y="146" width="60" height="18" rx="5" fill="#f2f0f8" stroke="#e1dcf5" stroke-dasharray="4 3"/>
        <rect x="18" y="172" width="60" height="18" rx="5" fill="#dff5e8"/><rect x="92" y="172" width="60" height="18" rx="5" fill="#fff1dc"/>
        <text x="18" y="218" font-weight="700" fill="#1d1846">Cause: ?</text>
      </g>
    </g>
  </g>
</svg>
